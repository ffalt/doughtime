import se.bjurr.gitchangelog.api.InclusivenessStrategy
import se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.gitChangelog)
}

def checkstyleVersion = libs.versions.checkstyle.get()

subprojects {
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = checkstyleVersion
        configFile = rootProject.file("app/config/checkstyle/checkstyle.xml")
        ignoreFailures = true
        showViolations = true
    }

    tasks.register('checkstyleMain', Checkstyle) {
        source 'src/main/java'
        include '**/*.java'
        exclude '**/R.java', '**/BuildConfig.java'
        classpath = files()
        reports {
            xml.required = true
            xml.outputLocation = layout.buildDirectory.file("reports/checkstyle/checkstyle.xml")
            html.required = true
            html.outputLocation = layout.buildDirectory.file("reports/checkstyle/checkstyle.html")
        }
    }

    plugins.withId('com.android.application') {
        tasks.named('check').configure {
            dependsOn 'checkstyleMain'
        }

        android {
            lint {
                abortOnError = false
                checkDependencies = true
                checkReleaseBuilds = true
                lintConfig = file("lint.xml")
                xmlReport = true
                htmlReport = true
                xmlOutput = layout.buildDirectory.file("reports/lint/lint-results.xml").get().asFile
                htmlOutput = layout.buildDirectory.file("reports/lint/lint-results.html").get().asFile
                baseline = file("lint-baseline.xml")
            }
        }
    }
}

// Template only for a single entry append (no global header)
def templateChangelogEntryContent = """{{#tags}}

{{#ifEquals name "Unreleased"}}
## Unreleased
{{else}}
## [{{name}}](https://github.com/ffalt/doughtime/compare/{{name}}) ({{tagDate .}})
{{/ifEquals}}

  {{#ifContainsType commits type='feat'}}
### Features

    {{#commits}}
      {{#ifCommitType . type='feat'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}} ([{{hash}}](https://github.com/ffalt/doughtime/commit/{{hashFull}}))
      {{/ifCommitType}}
    {{/commits}}
  {{/ifContainsType}}

  {{#ifContainsType commits type='fix'}}
### Bug Fixes

    {{#commits}}
      {{#ifCommitType . type='fix'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}} ([{{hash}}](https://github.com/ffalt/doughtime/commit/{{hashFull}}))
      {{/ifCommitType}}
    {{/commits}}
  {{/ifContainsType}}
{{/tags}}
"""

def templateReleaseLogContent = """{{#tags}}{{#ifContainsType commits type='feat'}}## Features

    {{#commits}}
      {{#ifCommitType . type='feat'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}} ([{{hash}}](https://github.com/ffalt/doughtime/commit/{{hashFull}}))
      {{/ifCommitType}}
    {{/commits}}
  {{/ifContainsType}}
  {{#ifContainsType commits type='fix'}}

## Bug Fixes

    {{#commits}}
      {{#ifCommitType . type='fix'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}} ([{{hash}}](https://github.com/ffalt/doughtime/commit/{{hashFull}}))
      {{/ifCommitType}}
    {{/commits}}
  {{/ifContainsType}}

## Full Changelog

https://github.com/ffalt/doughtime/compare/PREVIOUS...{{name}}
{{/tags}}
"""

def templateFdroidChangelogContent = """{{#tags}}
    {{#commits}}
{{#ifCommitType . type='feat'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}}
{{/ifCommitType}}{{#ifCommitType . type='fix'}}
 - {{#eachCommitScope .}} **{{.}}** {{/eachCommitScope}} {{{commitDescription .}}}
{{/ifCommitType}}{{/commits}}
{{/tags}}
"""

static def calculateAndroidVersionCode(versionName) {
    def (major, minor, patch, build) = versionName.replace("v", "").tokenize('.')
    (major, minor, patch, build) = [major, minor, patch, build].collect { it == null ? 0 : it.toInteger() }
    return (major * 1000 * 1000 * 1000) + (minor * 1000 * 1000) + (patch * 1000) + build
}

tasks.register('gitReleaseNotesTask', GitChangelogTask) {
    def currentVersion = project.version.toString()
    def prevTagProvider = providers.exec {
        commandLine 'bash', '-lc', "git tag --sort=-creatordate | grep -F -x -v \"${currentVersion}\" | head -n 1"
    }.standardOutput.getAsText().map { it.trim() }

    doFirst {
        println "Generating Release notes for ${currentVersion} compared to ${prevTagProvider.get()}"
    }

    toRevision.set(currentVersion)
    fromRevisionStrategy.set(InclusivenessStrategy.EXCLUSIVE)
    fromRevision.set(prevTagProvider)
    file.set(project.file("RELEASE_NOTES.md"))
    prependToFile.set(false) // false will replace the file, true will prepend content
    templateContent.set(prevTagProvider.map { prev_tag ->
        templateReleaseLogContent.replace("PREVIOUS", prev_tag)
    })
}

tasks.register('gitChangelogTask', GitChangelogTask) {
    def currentVersion = project.version.toString()
    // Append only the new changes since the latest tag to the top of CHANGELOG.md
    def prevTagProvider = providers.exec {
        commandLine 'bash', '-lc', "git tag --sort=-creatordate | grep -F -x -v \"${currentVersion}\" | head -n 1"
    }.standardOutput.getAsText().map { it.trim() }

    doFirst {
        println "Update CHANGELOG.md ${currentVersion}"
    }

    fromRevision.set(prevTagProvider.map { tag ->
        tag.isEmpty() ? "66b3d54098225d3738b73537fd5c7640bab594fa" : tag
    })
    fromRevisionStrategy.set(InclusivenessStrategy.EXCLUSIVE)
    toRevision.set(currentVersion)
    file.set(project.file("CHANGELOG.md"))
    prependToFile.set(true)
    templateContent.set(templateChangelogEntryContent)
}

tasks.register('bumpReleaseVersion') {
    def currentVersion = project.version.toString()
    def rootDirPath = rootDir.absolutePath
    def execOps = services.get(ExecOperations)
    doLast {
        def statusOut = new ByteArrayOutputStream()
        execOps.exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = statusOut
        }
        if (!statusOut.toString().trim().isEmpty()) {
            throw new GradleException('Git repository is dirty. Commit your changes first!')
        }

        // get next version
        def (major, minor, patch) = currentVersion.replace("v", "").tokenize('.')
        (major, minor, patch) = [major, minor, patch].collect { it.toInteger() }
        def nextVersion = "v${major}.${minor}.${patch + 1}"

        println("Bumping ${currentVersion} => ${nextVersion}")

        // update file
        def propsFile = new File(rootDirPath, "gradle.properties")
        def propsText = propsFile.text.replace(currentVersion, nextVersion)
        propsFile.text = propsText

        // commit
        execOps.exec {
            commandLine 'git', 'add', 'gradle.properties'
        }
        execOps.exec {
            commandLine 'git', 'commit', '-m', "Bump version to ${nextVersion}", '--no-gpg-sign'
        }
        // sign commit if needed or just use -s
        execOps.exec {
            commandLine 'git', 'commit', '--amend', '--no-edit', '--allow-empty', '-s'
        }
    }
}

tasks.register('prepareReleaseTag') {
    def currentVersion = project.version.toString()
    def execOps = services.get(ExecOperations)
    doLast {
        println("Adding temp tag ${currentVersion}")
        execOps.exec {
            commandLine 'git', 'tag', currentVersion
        }
    }
}

tasks.register('release') {
    def currentVersion = project.version.toString()
    def execOps = services.get(ExecOperations)
    def versionCode = calculateAndroidVersionCode(currentVersion)
    def fdroidRelPath = "fastlane/metadata/android/en-US/changelogs/${versionCode}.txt"
    def fdroidFile = project.file(fdroidRelPath)
    dependsOn tasks.named('prepareReleaseTag'), tasks.named('gitChangelogTask'), tasks.named('gitFdroidChangelogTask')

    doLast {
        println("Releasing ${currentVersion}")
        // remove temp tag
        execOps.exec {
            commandLine 'git', 'tag', '-d', currentVersion
        }
        // add fdroid changelog files
        // compute the exact fdroid changelog file created earlier
        if (fdroidFile.exists()) {
            println("Adding F-Droid changelog ${fdroidRelPath} to git")
            execOps.exec {
                commandLine 'git', 'add', fdroidRelPath
            }
        } else {
            println("Fdroid changelog not found at ${fdroidRelPath} - skipping add")
        }
        // commit changelog
        execOps.exec {
            commandLine 'git', 'add', '-A'
        }
        execOps.exec {
            commandLine 'git', 'commit', '-m', "Release ${currentVersion}", '--no-gpg-sign', '--allow-empty'
        }
        // sign commit
        execOps.exec {
            commandLine 'git', 'commit', '--amend', '--no-edit', '--allow-empty', '-s'
        }
        // add final release tag
        execOps.exec {
            commandLine 'git', 'tag', currentVersion
        }
        println("To publish the commit and tag: git push --atomic origin main ${currentVersion}")
    }
}

tasks.register('gitFdroidChangelogTask', GitChangelogTask) {
    def currentVersion = project.version.toString()
    def prevTagProvider = providers.exec {
        commandLine 'bash', '-lc', "git tag --sort=-creatordate | grep -F -x -v \"${currentVersion}\" | head -n 1"
    }.standardOutput.getAsText().map { it.trim() }

    doFirst {
        println("Update Fdroid changelogs ${currentVersion}")
        file.get().parentFile.mkdirs()
    }

    fromRevision.set(prevTagProvider.map { tag ->
        tag.isEmpty() ? "440bdfdf94c09ef4edf1885b25852078a66d6332" : tag
    })
    fromRevisionStrategy.set(InclusivenessStrategy.EXCLUSIVE)
    toRevision.set(currentVersion)
    def versionCode = calculateAndroidVersionCode(currentVersion)
    file.set(project.file("fastlane/metadata/android/en-US/changelogs/${versionCode}.txt"))
    prependToFile.set(false)
    templateContent.set(templateFdroidChangelogContent)
}

tasks.named('gitChangelogTask').configure { mustRunAfter tasks.named('prepareReleaseTag') }
tasks.named('gitFdroidChangelogTask').configure { mustRunAfter tasks.named('prepareReleaseTag') }
